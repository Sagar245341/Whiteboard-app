<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta
      name="description"
      content="Sketchter is your collaborative whiteboard for sketches, diagrams, and clear thinking. Create together in a focused workspace, with AI when you need it."
    />
    <title>Sketchter — Think visually. Build together.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const t = localStorage.getItem("sketchter-theme");
        document.documentElement.dataset.theme =
          t === "dark" || t === "light"
            ? t
            : matchMedia("(prefers-color-scheme:dark)").matches
              ? "dark"
              : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
